<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NutriSnap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .card-glow { box-shadow: 0 0 30px rgba(34, 197, 94, 0.15); }
    .upload-area { border: 2px dashed #334155; transition: all 0.3s; }
    .upload-area:hover { border-color: #22c55e; background: rgba(34, 197, 94, 0.05); }
    .pulse-green { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .slide-up { animation: slideUp 0.5s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">

  <!-- Header -->
  <header class="pt-10 pb-4 text-center px-4">
    <div class="flex items-center justify-center gap-2 mb-1">
      <span class="text-3xl">🥗</span>
      <h1 class="text-3xl font-extrabold tracking-tight">NutriSnap</h1>
    </div>
    <p class="text-slate-400 text-sm">Tire uma foto e descubra as calorias</p>
  </header>

  <!-- Main -->
  <main class="px-4 pb-12 max-w-md mx-auto">

    <!-- Upload Card -->
    <div class="bg-slate-800 rounded-3xl p-6 mb-4 shadow-xl">
      <label for="imageInput" class="upload-area rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer block">
        <div id="previewContainer" class="hidden w-full">
          <img id="preview" class="w-full rounded-xl object-cover max-h-64" />
        </div>
        <div id="uploadPlaceholder" class="flex flex-col items-center gap-3">
          <div class="bg-slate-700 rounded-full p-5">
            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
          <div class="text-center">
            <p class="text-white font-semibold">Tirar foto ou fazer upload</p>
            <p class="text-slate-400 text-sm mt-1">JPG, PNG ou WEBP</p>
          </div>
        </div>
        <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden"/>
      </label>
    </div>

    <!-- Analyze Button -->
    <button id="analyzeBtn" onclick="analyzeImage()"
      class="w-full bg-green-500 hover:bg-green-400 disabled:bg-slate-600 disabled:cursor-not-allowed text-white font-bold py-4 rounded-2xl text-lg transition-all duration-200 shadow-lg mb-6">
      Analisar Refeição
    </button>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-8">
      <div class="inline-flex items-center gap-3 bg-slate-800 rounded-2xl px-6 py-4">
        <div class="w-5 h-5 border-2 border-green-400 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-slate-300 font-medium">Analisando sua refeição...</span>
      </div>
    </div>

    <!-- Result Card -->
    <div id="result" class="hidden slide-up">
      <div class="bg-slate-800 rounded-3xl p-6 card-glow">

        <!-- Prato -->
        <div class="mb-5">
          <p class="text-slate-400 text-xs uppercase tracking-widest mb-1">Prato identificado</p>
          <h2 id="pratNome" class="text-xl font-bold text-green-400"></h2>
        </div>

        <!-- Macros principais -->
        <div class="grid grid-cols-2 gap-3 mb-5">
          <div class="bg-slate-700 rounded-2xl p-4 text-center">
            <p class="text-3xl font-extrabold text-yellow-400" id="calorias"></p>
            <p class="text-slate-400 text-sm mt-1">kcal</p>
          </div>
          <div class="bg-slate-700 rounded-2xl p-4 text-center">
            <p class="text-3xl font-extrabold text-blue-400" id="proteinas"></p>
            <p class="text-slate-400 text-sm mt-1">proteínas (g)</p>
          </div>
        </div>

        <!-- Itens -->
        <div class="mb-5">
          <p class="text-slate-400 text-xs uppercase tracking-widest mb-3">Composição</p>
          <div id="itensList" class="flex flex-col gap-2"></div>
        </div>

        <!-- Observação -->
        <div class="bg-slate-700 rounded-2xl p-4">
          <p class="text-slate-400 text-xs uppercase tracking-widest mb-1">💡 Dica nutricional</p>
          <p id="observacao" class="text-slate-200 text-sm leading-relaxed"></p>
        </div>

        <!-- Confiança -->
        <div class="mt-4 text-center">
          <span id="confianca" class="text-xs px-3 py-1 rounded-full bg-slate-700 text-slate-400"></span>
        </div>

      </div>

      <!-- Nova análise -->
      <button onclick="resetApp()" class="w-full mt-4 border border-slate-600 hover:border-green-500 text-slate-300 hover:text-green-400 font-semibold py-3 rounded-2xl transition-all duration-200">
        + Nova Análise
      </button>
    </div>

  </main>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const previewContainer = document.getElementById('previewContainer');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        preview.src = ev.target.result;
        previewContainer.classList.remove('hidden');
        uploadPlaceholder.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    });

    async function analyzeImage() {
      const file = imageInput.files[0];
      if (!file) { alert('Selecione uma imagem primeiro!'); return; }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('result').classList.add('hidden');
      document.getElementById('analyzeBtn').disabled = true;

      const formData = new FormData();
      formData.append('image', file);

      try {
        const response = await fetch('https://food-analyzer-wexy.onrender.com/analyze')
        const json = await response.json();

        if (!json.success) throw new Error(json.error);

        const d = json.data;
        document.getElementById('pratNome').textContent = d.prato;
        document.getElementById('calorias').textContent = d.calorias_total;
        document.getElementById('proteinas').textContent = d.proteinas_total;
        document.getElementById('observacao').textContent = d.observacao;

        const confiancaEl = document.getElementById('confianca');
        confiancaEl.textContent = `Confiança: ${d.confianca}`;
        confiancaEl.className = `text-xs px-3 py-1 rounded-full ${
          d.confianca === 'alta' ? 'bg-green-900 text-green-400' :
          d.confianca === 'média' ? 'bg-yellow-900 text-yellow-400' :
          'bg-red-900 text-red-400'
        }`;

        const itensList = document.getElementById('itensList');
        itensList.innerHTML = d.itens.map(item => `
          <div class="flex justify-between items-center bg-slate-700 rounded-xl px-4 py-3">
            <div>
              <p class="font-medium text-sm">${item.nome}</p>
              <p class="text-slate-400 text-xs">${item.quantidade}</p>
            </div>
            <div class="text-right">
              <p class="text-yellow-400 text-sm font-semibold">${item.calorias} kcal</p>
              <p class="text-blue-400 text-xs">${item.proteinas}g prot</p>
            </div>
          </div>
        `).join('');

        document.getElementById('result').classList.remove('hidden');

      } catch (err) {
        alert('Erro ao analisar. Tente novamente.');
        console.error(err);
      } finally {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('analyzeBtn').disabled = false;
      }
    }

    function resetApp() {
      imageInput.value = '';
      preview.src = '';
      previewContainer.classList.add('hidden');
      uploadPlaceholder.classList.remove('hidden');
      document.getElementById('result').classList.add('hidden');
    }
  </script>

</body>
</html>
